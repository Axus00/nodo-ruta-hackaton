services:
  instancia-1:
    build: .
    container_name: instancia-1
    environment:
      INSTANCE_ID: instancia-1
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    restart: unless-stopped

  instancia-2:
    build: .
    container_name: instancia-2
    environment:
      INSTANCE_ID: instancia-2
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - instancia-1
      - instancia-2
    restart: unless-stopped