# Balanceador para "Nodo Ruta" dentro de docker compose.
# Las instancias se alcanzan por nombre de servicio en el puerto interno 8080.

upstream nodo_ruta {
    # Memoria compartida entre los procesos de NGINX: sin "zone", cada proceso lleva su
    # propio turno y su propio conteo de fallos, y casi todo cae en la primera instancia.
    zone nodo_ruta 64k;
    # Tras 1 fallo, la instancia queda fuera 15s y todo va a la otra.
    server instancia-1:8080 max_fails=1 fail_timeout=15s;
    server instancia-2:8080 max_fails=1 fail_timeout=15s;
    # Modo activo/respaldo: agrega "backup" a la segunda línea.
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://nodo_ruta;

        # Failover: si la instancia está caída, no responde o da 500/502/504,
        # se reintenta la misma petición en la otra instancia.
        # El 503 queda fuera a propósito: la app lo devuelve cuando los datos son inválidos, y las dos
        # instancias leen el mismo archivo. Reintentarlo no ayuda, marca ambas como caídas y NGINX
        # termina respondiendo un 502 en HTML; así llega al cliente el 503 {"estado": "error_datos"}.
        proxy_next_upstream error timeout http_500 http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Depuración: qué instancia(s) atendieron la petición
        add_header X-Upstream $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
    }
}
